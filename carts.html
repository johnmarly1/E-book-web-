<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookVerse Cart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5f7ff;
      --panel: #ffffff;
      --panel-alt: #eef3ff;
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --secondary: #14b8a6;
      --danger: #ef4444;
      --text: #172033;
      --muted: #61708a;
      --line: rgba(23, 32, 51, 0.08);
      --shadow: 0 18px 42px rgba(79, 70, 229, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Inter", sans-serif;
    }

    body {
      background: linear-gradient(180deg, #eef4ff 0%, #f7f9fc 100%);
      color: var(--text);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      border: none;
      font: inherit;
      cursor: pointer;
    }

    .container {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar {
      background: rgba(15, 23, 42, 0.9);
      color: white;
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 74px;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      box-shadow: 0 12px 24px rgba(20, 184, 166, 0.25);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 22px;
      color: rgba(255,255,255,0.8);
    }

    .nav-links a:hover {
      color: white;
    }

    .page {
      padding: 48px 0 60px;
    }

    .page-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .page-header h1 {
      font-size: clamp(2.2rem, 4vw, 3.2rem);
      letter-spacing: -0.06em;
    }

    .count-badge {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 700;
      box-shadow: var(--shadow);
    }

    .cart-layout {
      display: grid;
      grid-template-columns: 1.5fr 0.85fr;
      gap: 24px;
      align-items: start;
    }

    .cart-panel,
    .summary-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 26px;
      box-shadow: var(--shadow);
    }

    .cart-panel {
      padding: 22px;
    }

    .cart-list {
      display: grid;
      gap: 16px;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 100px 1fr auto;
      align-items: center;
      gap: 18px;
      background: rgba(79, 70, 229, 0.025);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
    }

    .item-cover {
      width: 100px;
      height: 112px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 2.2rem;
      background: linear-gradient(135deg, #1d4ed8, #7c3aed, #14b8a6);
      color: white;
      box-shadow: inset 0 0 12px rgba(255,255,255,0.2);
    }

    .item-info h3 {
      font-size: 1.2rem;
      margin-bottom: 5px;
    }

    .item-info p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .item-price {
      font-weight: 800;
      color: var(--primary);
    }

    .quantity-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--panel-alt);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 10px;
      min-width: 130px;
    }

    .qty-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      font-size: 1.2rem;
      display: grid;
      place-items: center;
      line-height: 1;
    }

    .qty-btn.remove {
      background: rgba(239, 68, 68, 0.12);
      color: var(--danger);
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 18px;
      background: rgba(79, 70, 229, 0.02);
    }

    .summary-panel {
      padding: 22px;
      position: sticky;
      top: 100px;
    }

    .summary-panel h2 {
      font-size: 1.5rem;
      margin-bottom: 22px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 0;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
    }

    .summary-row.total {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text);
      border-bottom: none;
      padding-top: 18px;
    }

    .checkout-btn {
      margin-top: 18px;
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      height: 52px;
      border-radius: 14px;
      font-weight: 700;
      box-shadow: 0 16px 30px rgba(20, 184, 166, 0.18);
    }

    .continue-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-top: 12px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(79, 70, 229, 0.02);
      color: var(--text);
      font-weight: 600;
    }

    @media (max-width: 820px) {
      .cart-layout {
        grid-template-columns: 1fr;
      }

      .summary-panel {
        position: static;
      }
    }

    @media (max-width: 560px) {
      .nav-links {
        display: none;
      }

      .cart-item {
        grid-template-columns: 80px 1fr;
      }

      .quantity-box {
        grid-column: 1 / -1;
        justify-self: start;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <div class="brand">
        <span class="brand-mark">📚</span>
        <span>BookVerse</span>
      </div>

      <nav class="nav-links" aria-label="Main navigation">
        <a href="book.html">Home</a>
        <a href="book.html#books">Books</a>
        <a href="book.html#pricing">Pricing</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="container">
      <div class="page-header">
        <h1>Your cart</h1>
        <div class="count-badge" id="cartBadge">0 items</div>
      </div>

      <div class="cart-layout">
        <section class="cart-panel">
          <div class="cart-list" id="cartList"></div>
        </section>

        <aside class="summary-panel">
          <h2>Summary</h2>

          <div class="summary-row">
            <span>Subtotal</span>
            <strong id="subtotal">$0.00</strong>
          </div>

          <div class="summary-row">
            <span>Delivery</span>
            <strong>Free</strong>
          </div>

          <div class="summary-row total">
            <span>Total</span>
            <strong id="total">$0.00</strong>
          </div>

          <button class="checkout-btn" id="checkoutBtn">Checkout</button>
          <a class="continue-link" href="book.html">Continue shopping</a>
        </aside>
      </div>
    </div>
  </main>

  <script>
    const cartKey = 'bookVerseCart';
    const cartList = document.getElementById('cartList');
    const totalLabel = document.getElementById('total');
    const subtotalLabel = document.getElementById('subtotal');
    const cartBadge = document.getElementById('cartBadge');
    const checkoutBtn = document.getElementById('checkoutBtn');

    function getCart() {
      try {
        return JSON.parse(localStorage.getItem(cartKey)) || [];
      } catch {
        return [];
      }
    }

    function saveCart(items) {
      localStorage.setItem(cartKey, JSON.stringify(items));
    }

    function renderCart() {
      const cart = getCart();
      cartList.innerHTML = '';

      if (!cart.length) {
        cartList.innerHTML = `
          <div class="empty-state">
            <h3>Your cart is empty</h3>
            <p>Add a book from the store to start your reading list.</p>
          </div>
        `;
        totalLabel.textContent = '$0.00';
        subtotalLabel.textContent = '$0.00';
        cartBadge.textContent = '0 items';
        return;
      }

      let subtotal = 0;
      cart.forEach(item => {
        subtotal += item.price * item.qty;

        cartList.innerHTML += `
          <div class="cart-item">
            <div class="item-cover">${item.emoji}</div>

            <div class="item-info">
              <h3>${item.name}</h3>
              <p>${item.category}</p>
              <div class="item-price">$${item.price}</div>
            </div>

            <div class="quantity-box">
              <button class="qty-btn remove" data-action="remove" data-id="${item.id}">−</button>
              <span>${item.qty}</span>
              <button class="qty-btn" data-action="add" data-id="${item.id}">+</button>
            </div>
          </div>
        `;
      });

      totalLabel.textContent = `$${subtotal.toFixed(2)}`;
      subtotalLabel.textContent = `$${subtotal.toFixed(2)}`;
      cartBadge.textContent = `${cart.reduce((sum, item) => sum + item.qty, 0)} items`;

      document.querySelectorAll('.qty-btn').forEach(button => {
        button.addEventListener('click', () => updateQuantity(Number(button.dataset.id), button.dataset.action));
      });
    }

    function updateQuantity(id, action) {
      const cart = getCart();
      const item = cart.find(entry => entry.id === id);

      if (!item) return;

      if (action === 'add') {
        item.qty += 1;
      }

      if (action === 'remove') {
        item.qty -= 1;
      }

      const updatedCart = cart.filter(entry => entry.qty > 0);
      saveCart(updatedCart);
      renderCart();
    }

    checkoutBtn.addEventListener('click', () => {
      const cart = getCart();
      if (!cart.length) {
        alert('Your cart is empty. Add a few books first.');
        return;
      }

      window.location.href = 'maping.html';
    });

    renderCart();
  </script>
</body>
</html>
