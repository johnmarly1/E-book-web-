<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Book Store</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:linear-gradient(135deg,#6C63FF,#00C9A7);
min-height:100vh;
padding:40px;
}

h1{
text-align:center;
color:white;
margin-bottom:35px;
font-size:40px;
}

.container{
display:grid;
grid-template-columns:2fr 1fr;
gap:25px;
}

.books{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:rgba(255,255,255,.18);
backdrop-filter:blur(15px);
padding:20px;
border-radius:20px;
color:white;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.2);
transition:.4s;
}

.card:hover{
transform:translateY(-10px);
}

.book-img{
font-size:70px;
margin-bottom:10px;
}

.price{
font-size:22px;
font-weight:bold;
margin:10px 0;
color:#FFE600;
}

button{
background:#fff;
color:#6C63FF;
border:none;
padding:10px 18px;
border-radius:30px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#FFE600;
}

.cart{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,.2);
position:sticky;
top:20px;
}

.cart h2{
margin-bottom:20px;
color:#6C63FF;
}

.cart-item{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
padding-bottom:10px;
border-bottom:1px solid #ddd;
}

.qty{
display:flex;
align-items:center;
gap:8px;
}

.qty button{
width:30px;
height:30px;
padding:0;
border-radius:50%;
background:#6C63FF;
color:white;
}

.total{
font-size:24px;
font-weight:bold;
margin-top:20px;
color:#00A86B;
}

.checkout{
width:100%;
margin-top:20px;
background:#6C63FF;
color:white;
padding:15px;
border-radius:12px;
font-size:18px;
}

.checkout:hover{
background:#4B43E6;
}

.empty{
color:#888;
text-align:center;
margin-top:20px;
}

@media(max-width:900px){

.container{
grid-template-columns:1fr;
}

}

</style>

</head>
<body>

<h1>📚 Premium E-Book Store</h1>

<div class="container">

<div class="books" id="books"></div>

<div class="cart">

<h2><a href="book.html">🛒 Your Cart</a></h2>

<div id="cartItems">
<p class="empty">Cart is Empty</p>
</div>

<div class="total">
Total: $<span id="total">0</span>
</div>

<button class="checkout">
Checkout
</button>

</div>

</div>

<script>

const books=[

{
id:1,
name:"JavaScript Master",
price:25,
icon:"📘"
},

{
id:2,
name:"HTML & CSS Guide",
price:18,
icon:"📗"
},

{
id:3,
name:"React Complete",
price:35,
icon:"📙"
},

{
id:4,
name:"Python Pro",
price:28,
icon:"📕"
},

{
id:5,
name:"Node.js API",
price:30,
icon:"📔"
},

{
id:6,
name:"UI/UX Design",
price:22,
icon:"📓"
}

];

const booksDiv=document.getElementById("books");
const cartItems=document.getElementById("cartItems");
const total=document.getElementById("total");

let cart=[];

books.forEach(book=>{

booksDiv.innerHTML+=`

<div class="card">

<div class="book-img">${book.icon}</div>

<h3>${book.name}</h3>

<div class="price">$${book.price}</div>

<button onclick="addCart(${book.id})">
Add To Cart
</button>

</div>

`;

});

function addCart(id){

const item=cart.find(x=>x.id===id);

if(item){

item.qty++;

}else{

const book=books.find(x=>x.id===id);

cart.push({...book,qty:1});

}

renderCart();

}

function renderCart(){

cartItems.innerHTML="";

if(cart.length===0){

cartItems.innerHTML='<p class="empty">Cart is Empty</p>';

total.innerHTML="0";

return;

}

let sum=0;

cart.forEach(item=>{

sum+=item.price*item.qty;

cartItems.innerHTML+=`

<div class="cart-item">

<div>

<b>${item.name}</b><br>

$${item.price}

</div>

<div class="qty">

<button onclick="minus(${item.id})">-</button>

${item.qty}

<button onclick="plus(${item.id})">+</button>

</div>

</div>

`;

});

total.innerHTML=sum;

}

function plus(id){

cart.find(x=>x.id===id).qty++;

renderCart();

}

function minus(id){

const item=cart.find(x=>x.id===id);

item.qty--;

if(item.qty==0){

cart=cart.filter(x=>x.id!==id);

}

renderCart();

}

</script>

</body>
</html>
